<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Santa Casa</title>

    <link rel="stylesheet" href="login.css">

    <!-- Ícones -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">

        <!-- Lado esquerdo -->
        <div class="login-box">

            <div class="logo">
                <img src="logosantacasa.webp" alt="Logo" width="300">
            </div>

            <form>

                <label>Usuário</label>

                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="usuario">
                </div>

                <label>Senha</label>

                <div class="input-box">
                    <input type="password" id="senha">
                    <i class="fa-solid fa-eye" id="olho"></i>
                </div>

                <button type="button" onclick="entrar()">
                    Acessar
                </button>

                <a href="recuperar.html" class="forgot">>
                    Esqueceu a senha?
                </a>

            </form>

        </div>

        <!-- Lado direito -->
        <div class="image-box">
            <img src="loginimg1.jpeg" alt="Imagem Login" id="imagemLogin">
        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
